# Gitleaks configuration — Hinabangan NHS SMS
#
# NOTE: TOML forbids redefining a table. Keep exactly ONE [allowlist] block here;
# a second one makes this file unparseable and fails the whole CI quality gate.

title = "Hinabangan NHS SMS"

[allowlist]
description = "Non-secret patterns and documentation paths"
# Only specific, justified paths. Do NOT blanket-allowlist *.txt or *.md at the
# root: seeded credential dumps ship as .txt, so a wildcard here hides real leaks.
paths = [
  '''(^|/)docs/.*''',
  '''(^|/)[^/]+\.(example|sample)$''',
  '''(^|/)server/\.env\.example$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.github/(dependabot\.yml|release-drafter\.yml)$''',
  # accounts.txt is a seeded local-credential dump that is gitignored and was
  # deleted in db85eb9, but still exists in history (commits e00daf6/75408d9).
  # Those seeded passwords follow a predictable pattern (HnHS-<year>!<user>), so
  # they must be rotated wherever they were ever used. The file must also be
  # purged from history — see DEPLOYMENT_RUNBOOK.md. Remove this line once the
  # rewrite is done.
  '''(^|/)accounts\.txt$''',
]
regexes = [
  '''(?i)(change-me-to-a-long-random-string)''',
  '''(?i)(your[-_]?\w*[-_]?here)''',
  '''(?i)(insert[-_]?\w*[-_]?here)''',
  '''(?i)(example|sample|template|placeholder|dummy|mock)[-_]?(key|secret|token|password)''',
  '''postgresql://[^:\s]+:meridianed-dev@''',
]

[[rules]]
    id = "rule"
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "aws"]

[[rules]]
    id = "rule"
description = "GitHub Token"
regex = '''(gh[pousr]_[A-Za-z0-9_]{36,251})'''
tags = ["key", "github"]

[[rules]]
    id = "rule"
description = "GitLab PAT"
regex = '''glpat-[A-Za-z0-9_-]{20,}'''
tags = ["key", "gitlab"]

[[rules]]
    id = "rule"
description = "Slack Token / Webhook"
regex = '''(xox[baprs]-[A-Za-z0-9-]{10,}|(?:https://hooks\.slack\.com/services/)[A-Za-z0-9/]{20,})'''
tags = ["key", "slack"]

[[rules]]
    id = "rule"
description = "Stripe Secret Key"
regex = '''(sk_live_[A-Za-z0-9]{24,})'''
tags = ["key", "stripe"]

[[rules]]
    id = "rule"
description = "OpenAI API Key"
regex = '''(sk-[A-Za-z0-9]{48,})'''
tags = ["key", "openai"]

[[rules]]
    id = "rule"
description = "Groq API Key"
regex = '''(gsk_[A-Za-z0-9]{32,})'''
tags = ["key", "groq"]

[[rules]]
    id = "rule"
description = "Google/Gemini API Key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["key", "google"]

[[rules]]
    id = "rule"
description = "Render Deploy Hook"
regex = '''api\.render\.com/deploy/srv-[a-z0-9]+\?key=[A-Za-z0-9_-]{10,}'''
tags = ["key", "render"]

[[rules]]
    id = "rule"
description = "Database URL with inline credentials"
regex = '''(?i)\b(postgres(?:ql)?|mysql|mongodb(?:\+srv)?)://[^:/\s]+:[^@/\s]+@'''
tags = ["database", "connection-string"]

[[rules]]
    id = "rule"
description = "JWT Secret assignment"
regex = '''(?i)JWT_SECRET\s*[=:]\s*["']?[A-Za-z0-9_\-]{24,}'''
tags = ["secret", "jwt"]

[[rules]]
    id = "rule"
description = "Private Key block"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'''
tags = ["key", "private-key"]

[[rules]]
    id = "rule"
description = "Cloudflare R2 Secret Key"
regex = '''(?i)r2_secret_key\s*[=:]\s*["']?[A-Za-z0-9]{32,}'''
tags = ["key", "cloudflare"]

[[rules]]
    id = "rule"
description = "Firebase service account JSON"
regex = '''"type"\s*:\s*"service_account"'''
tags = ["key", "firebase"]

[[rules]]
    id = "rule"
description = "Generic high-entropy secret assignment"
regex = '''(?i)\b(api[_-]?key|secret|token|password|passwd)\b\s*[=:]\s*["']?[A-Za-z0-9/+_\-]{32,}'''
secretGroup = 1
tags = ["secret", "generic"]
keywords = ["secret", "token", "password", "apikey", "api_key"]
