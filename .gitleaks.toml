# Gitleaks configuration for Hinabangan NHS SMS
# Detects secrets in git history and prevents future commits with secrets

[allowlist]
description = "Allowlisted patterns that are not secrets"
paths = [
  "*.md",
  "*.txt",
  "*.example",
  "*.sample",
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
]
regexes = [
  # Example/template values in docs and config templates
  "(?i)(example|sample|template|placeholder|change-me|your-|xxx|test|dummy|fake|mock)",
  # Common non-secret patterns
  "^(change-me-to-a-long-random-string|your-.*-here|insert-.*-here)$",
]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(?:api[_-]?key|apikey)['"\s:=]+([a-zA-Z0-9_\-]{20,})'''
tags = ["key", "api"]
entropy = 3.0

[[rules]]
description = "AWS Access Key ID"
regex = '''(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "aws"]

[[rules]]
description = "AWS Secret Access Key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key['"\s:=]+([a-zA-Z0-9/+=]{40})'''
tags = ["key", "aws"]

[[rules]]
description = "GitHub Personal Access Token"
regex = '''(gh[pousr]_[A-Za-z0-9_]{36,251})'''
tags = ["key", "github"]

[[rules]]
description = "GitHub OAuth Token"
regex = '''(gho_[A-Za-z0-9_]{36,251})'''
tags = ["key", "github"]

[[rules]]
description = "GitHub App Token"
regex = '''(ghs_[A-Za-z0-9_]{36,251})'''
tags = ["key", "github"]

[[rules]]
description = "GitHub Refresh Token"
regex = '''(ghr_[A-Za-z0-9_]{36,251})'''
tags = ["key", "github"]

[[rules]]
description = "JWT Secret"
regex = '''(?i)jwt[_-]?secret['"\s:=]+([a-zA-Z0-9_\-=]{32,})'''
tags = ["secret", "jwt"]

[[rules]]
description = "Database URL with credentials"
regex = '''(?i)(postgres(?:ql)?|mysql|mongodb)://[^:]+:[^@]+@'''
tags = ["database", "connection-string"]

[[rules]]
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]{9}/[A-Z0-9]{9}/[a-zA-Z0-9]{24}'''
tags = ["webhook", "slack"]

[[rules]]
description = "Slack Bot Token"
regex = '''(xox[baprs]-[a-zA-Z0-9-]{10,48})'''
tags = ["key", "slack"]

[[rules]]
description = "SendGrid API Key"
regex = '''(SG\.[a-zA-Z0-9_\-]{22}\.[a-zA-Z0-9_\-]{43})'''
tags = ["key", "sendgrid"]

[[rules]]
description = "Stripe API Key"
regex = '''(sk_live_[a-zA-Z0-9]{24,})'''
tags = ["key", "stripe"]

[[rules]]
description = "OpenAI API Key"
regex = '''(sk-[a-zA-Z0-9]{48,})'''
tags = ["key", "openai"]

[[rules]]
description = "Groq API Key"
regex = '''(gsk_[a-zA-Z0-9]{32,})'''
tags = ["key", "groq"]

[[rules]]
description = "Firebase Service Account"
regex = '''"type":\s*"service_account"'''
tags = ["key", "firebase"]

[[rules]]
description = "Cloudflare R2 Credentials"
regex = '''(?i)(r2[_-]?(access[_-]?key|secret[_-]?key|endpoint|bucket))['"\s:=]+([a-zA-Z0-9_\-./:]{20,})'''
tags = ["key", "cloudflare", "r2"]

[[rules]]
description = "SMTP Credentials"
regex = '''(?i)(smtp[_-]?(host|port|user|pass))['"\s:=]+([a-zA-Z0-9_\-.:@]{8,})'''
tags = ["secret", "smtp"]

[[rules]]
description = "Generic Password in Config"
regex = '''(?i)(password|passwd|pwd)['"\s:=]+([^\s'"]{8,})'''
tags = ["secret", "password"]
entropy = 3.5

[[rules]]
description = "Private Key"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private-key"]

[[rules]]
description = "SSH Private Key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
tags = ["key", "ssh"]

[[rules]]
description = "Base64 Encoded Secret (high entropy)"
regex = '''(?i)(secret|token|key|password)['"\s:=]+([A-Za-z0-9+/]{40,}={0,2})'''
tags = ["secret", "base64"]
entropy = 4.5

# Path-specific allowlists for known false positives
[allowlist]
paths = [
  "server/.env.example",
  "docs/**",
  "*.md",
]