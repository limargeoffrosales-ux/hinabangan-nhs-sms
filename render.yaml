# Render Blueprint — deploy the whole system (API + web portal) in one click.
# Database: Neon free tier (no expiry) — paste the Neon connection string
# into Render → hinabangan-nhs → Environment → DATABASE_URL → Save & redeploy.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hinabangan-nhs
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
