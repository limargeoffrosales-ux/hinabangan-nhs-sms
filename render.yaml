# Render Blueprint — deploy the whole system (API + web portal + Postgres) in one click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hinabangan-nhs
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hinabangan-nhs-db
          property: connectionString

databases:
  - name: hinabangan-nhs-db
    databaseName: hinabangan_nhs
    user: hinabangan_nhs
    plan: free
