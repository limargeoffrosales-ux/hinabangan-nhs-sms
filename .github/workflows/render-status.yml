name: Render Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query Render build logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "NO RENDER_API_KEY SECRET"; exit 0; fi
          echo "=== latest build logs ==="
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/logs?limit=100&type=build" > /tmp/logs.json
          python3 -c "
          import json
          d = json.load(open('/tmp/logs.json'))
          items = d.get('logs', d if isinstance(d, list) else [])
          for line in items:
              if isinstance(line, dict):
                  print(str(line.get('timestamp',''))[:19], '|', str(line.get('message', line)))
              else:
                  print(line)
          " | tail -n 100
