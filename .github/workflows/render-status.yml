name: Render Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Render logs API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "NO RENDER_API_KEY SECRET"; exit 0; fi
          for Q in "limit=50" "limit=50&type=build" "type=build" "limit=1"; do
            echo "=== /v1/logs?$Q ==="
            curl -s -o /tmp/out.json -w "HTTP %{http_code}\n" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/logs?$Q"
            head -c 800 /tmp/out.json
            echo ""
          done
