name: Render Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Render service config + logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then echo "NO RENDER_API_KEY SECRET"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" > /tmp/svc.json
          SID=$(python3 -c "import json; d=json.load(open('/tmp/svc.json')); print([x['service']['id'] for x in d if x['service']['name']=='hinabangan-nhs'][0])")
          echo "SERVICE_ID=$SID"
          curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID" > /tmp/sd.json
          python3 -c "
          import json
          s = json.load(open('/tmp/sd.json'))
          print('serviceDetails keys:', sorted(s['serviceDetails'].keys()))
          for k in ('buildCommand','startCommand','healthCheckPath','envVars','preDeployCommand','runtime','plan','numInstances'):
              if k in s['serviceDetails']:
                  print(k, '=', json.dumps(s['serviceDetails'][k])[:400])
          "
          echo "=== logs 400 body ==="
          curl -s -w "\nHTTP %{http_code}\n" -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/logs?ownerId=tea-d9tr6fnqj5pc738acfp0&limit=10&type=build" | head -c 1200
