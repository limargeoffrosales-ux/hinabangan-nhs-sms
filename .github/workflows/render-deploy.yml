name: Render Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full check (lint, typecheck, build, i18n, server tests)
        run: npm run check
  deploy:
    name: Deploy to Render
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
