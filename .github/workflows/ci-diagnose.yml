# TEMPORARY diagnostic — isolates each step into its own job so failures can be
# attributed without log access. No deploys, no secrets.
# Delete once the real workflow is green.
name: CI Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  a-checkout:
    name: A-checkout-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

  b-node-nocache:
    name: B-node-nocache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

  c-node-cache:
    name: C-node-withcache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

  d-npmci-nocache:
    name: D-npmci-nocache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts

  e-npmci-scripts:
    name: E-npmci-withscripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
