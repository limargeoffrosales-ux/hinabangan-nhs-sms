# TEMPORARY diagnostic — splits the quality gate into separate jobs so a
# failure can be attributed to a single step. Safe: no deploys, no secrets.
# Delete once the real workflow is green.
name: CI Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    name: DIAG-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci

  gitleaks:
    name: DIAG-gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: DIAG-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit gate
        run: npm run audit

  check:
    name: DIAG-fullcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full check
        run: npm run check
