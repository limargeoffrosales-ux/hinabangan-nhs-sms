# TEMPORARY diagnostic. Answers one question: does a SCHEDULED run get a
# runner when push-triggered runs do not?
#   - schedule fails too  -> billing/quota blocks all non-Dependabot runs
#   - schedule succeeds  -> quota is fine; something blocks push/PR events
# Delete immediately after reading the result.
name: Runner Probe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Can this repo get a runner?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove a runner executed this
        run: |
          echo "RUNNER OK"
          node --version
          echo "probe finished"