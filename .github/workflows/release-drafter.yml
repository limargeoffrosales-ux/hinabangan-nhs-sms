name: Release Drafter

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  release-drafter:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # v6 takes `config-name` (a path relative to .github/), not
          # `config-file`. The file sits at .github/release-drafter.yml,
          # which is also the action's default - named explicitly so the
          # link to the config is obvious.
          config-name: release-drafter.yml
          publish: true
          tag: ${{ github.event.inputs.tag || github.ref_name }}