services:
  postgres:
    image: postgres:16-alpine
    container_name: meridianed-pg
    environment:
      POSTGRES_DB: meridianed
      POSTGRES_USER: meridianed
      POSTGRES_PASSWORD: meridianed-dev
    ports:
      - "5432:5432"
    volumes:
      - meridianed-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridianed"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meridianed-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - meridianed-redis-data:/data

volumes:
  meridianed-pg-data:
  meridianed-redis-data: